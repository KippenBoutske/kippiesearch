configuration:
  log_level:
    name: Log level
    description: Structured JSON logs (secrets are redacted).
  api_token:
    name: API / MCP token
    description: Bearer token for LAN access to API and MCP. Home Assistant ingress stays open. Leave empty to disable auth (not recommended).
  nas_roots:
    name: NAS / share folders
    description: Explicit folders to index. Empty = none (recommended). Do not set all of /share — that is other add-ons' app data. After adding network storage "home" the path is /share/home.
  nas_smb_enabled:
    name: Enable SMB fallback
    description: Read Synology shares directly when HA mounts are empty. Read-only.
  nas_smb_host:
    name: SMB host
    description: LAN address of the NAS, e.g. 192.168.1.x. Empty disables SMB.
  nas_smb_port:
    name: SMB port
  nas_smb_shares:
    name: SMB share names
    description: NAS share names, e.g. home or documents. Empty disables SMB.
  nas_smb_username:
    name: SMB username
    description: Leave empty until you use the SMB fallback. Do not put credentials in git.
  nas_smb_password:
    name: SMB password
    description: Store only in this add-on option, never in the repository.
  itslearning_enabled:
    name: Enable it's learning sync
  itslearning_url:
    name: it's learning URL
    description: For example https://<school>.itslearning.com. Empty disables sync.
  itslearning_organisation:
    name: School / organisation name
    description: Optional, display only. No default.
  itslearning_username:
    name: it's learning username
  itslearning_password:
    name: it's learning password
  itslearning_rate_limit_s:
    name: it's learning delay (seconds)
  itslearning_cron:
    name: Daily school sync (cron)
  nas_cron:
    name: NAS rescan (cron)
  embedder:
    name: Embedder
    description: onnx = EmbeddingGemma 2 q4 (download once to /data). hash = tests/no-model.
  embedding_dim:
    name: Vector size (MRL)
  max_seq_length:
    name: Max tokens per chunk
  onnx_threads:
    name: ONNX CPU threads
  chunk_chars:
    name: Chunk size (characters)
  chunk_overlap:
    name: Chunk overlap
  batch_size:
    name: Embedding batch size
  max_file_mb:
    name: Max file size (MB)
  throttle_s:
    name: Pause between files (s)
  exclude_globs:
    name: Exclude globs
    description: Extra paths to skip. Plugins, cache, node_modules, minified JS and similar app data are always skipped.
  ocr_enabled:
    name: OCR for images
    description: Off by default (RAM). Images are skipped.
  chat_enabled:
    name: RAG chat
    description: Local GGUF model (llama-cpp-python) for the chat UI and MCP tool ask. Off = search only.
  chat_model:
    name: Chat model
    description: Preset gemma3-1b (default) or gemma3-4b, or Hugging Face repo:file.gguf. Downloads to /data on first use, then offline.
  chat_n_ctx:
    name: Chat context (tokens)
    description: Smaller uses less RAM. 2048 is a good Pi 5 default.
  chat_n_threads:
    name: Chat CPU threads
    description: Leave cores for Home Assistant. 2 is safe on a Pi 5.
  chat_max_tokens:
    name: Max answer tokens
  chat_temperature:
    name: Temperature
  chat_idle_unload_minutes:
    name: Unload model after idle (minutes)
    description: 0 keeps it in RAM. 15 saves memory next to Home Assistant.
  chat_top_k:
    name: RAG hits per question
network:
  8765/tcp: Web UI, REST API, chat (SSE) and MCP (/mcp)
