configuration:
  log_level:
    name: Logniveau
    description: Gestructureerde JSON-logs (wachtwoorden/tokens worden weggefilterd).
  api_token:
    name: API-/MCP-token
    description: Bearer-token voor LAN-toegang tot API en MCP. Home Assistant ingress blijft open. Leeg = geen auth (niet aanbevolen).
  nas_roots:
    name: NAS-/share-mappen
    description: Expliciete paden om te indexeren. Leeg = niets (aanbevolen). Niet heel /share zetten — daar staat app-data van andere add-ons. Na netwerkopslag "home" is het pad /share/home.
  nas_smb_enabled:
    name: SMB-fallback inschakelen
    description: Synology-shares rechtstreeks lezen als HA-mounts leeg zijn. Alleen lezen.
  nas_smb_host:
    name: SMB-host
    description: LAN-adres van de NAS, bijvoorbeeld 192.168.1.x. Leeg = SMB uit.
  nas_smb_port:
    name: SMB-poort
  nas_smb_shares:
    name: SMB-sharenamen
    description: Namen van shares op de NAS, bijvoorbeeld home of documents. Leeg = SMB uit.
  nas_smb_username:
    name: SMB-gebruikersnaam
    description: Leeg tot je de SMB-fallback gebruikt. Geen wachtwoorden in git.
  nas_smb_password:
    name: SMB-wachtwoord
    description: Alleen in deze HA-optie zetten, nooit in de repo.
  itslearning_enabled:
    name: it's learning-sync inschakelen
  itslearning_url:
    name: it's learning-URL
    description: Bijvoorbeeld https://<school>.itslearning.com. Leeg = sync uit.
  itslearning_organisation:
    name: School-/organisatienaam
    description: Optioneel, alleen ter herkenning. Geen default.
  itslearning_username:
    name: it's learning-gebruikersnaam
  itslearning_password:
    name: it's learning-wachtwoord
  itslearning_rate_limit_s:
    name: it's learning pauze (seconden)
  itslearning_cron:
    name: Dagelijkse schoolsync (cron)
  nas_cron:
    name: NAS-rescan (cron)
  embedder:
    name: Embedder
    description: onnx = EmbeddingGemma 2 q4 (eenmalig downloaden naar /data). hash = tests/zonder model.
  embedding_dim:
    name: Vectorgrootte (MRL)
  max_seq_length:
    name: Max. tokens per chunk
  onnx_threads:
    name: ONNX CPU-threads
  chunk_chars:
    name: Chunkgrootte (tekens)
  chunk_overlap:
    name: Chunk-overlap
  batch_size:
    name: Embedding-batchgrootte
  max_file_mb:
    name: Max. bestandsgrootte (MB)
  throttle_s:
    name: Pauze tussen bestanden (s)
  exclude_globs:
    name: Uitsluit-globs
    description: Extra paden om over te slaan. Plugins, cache, node_modules, minified JS en vergelijkbare app-data worden sowieso overgeslagen.
  ocr_enabled:
    name: OCR voor afbeeldingen
    description: Standaard uit (RAM). Afbeeldingen worden overgeslagen.
  chat_enabled:
    name: RAG-chat
    description: Lokaal GGUF-model (llama-cpp-python) achter de chat-UI en MCP-tool ask. Uit = alleen zoeken.
  chat_model:
    name: Chatmodel
    description: Preset gemma3-1b (default) of gemma3-4b, of Hugging Face repo:bestand.gguf. Eerste keer download naar /data, daarna offline.
  chat_n_ctx:
    name: Chat-context (tokens)
    description: Kleiner = minder RAM. 2048 is een goede default op Pi 5.
  chat_n_threads:
    name: Chat-CPU-threads
    description: Laat cores over voor Home Assistant. 2 is veilig op Pi 5.
  chat_max_tokens:
    name: Max. antwoordtokens
  chat_temperature:
    name: Temperatuur
  chat_idle_unload_minutes:
    name: Model unloaden na idle (minuten)
    description: 0 = in RAM houden. 15 spaart geheugen naast Home Assistant.
  chat_top_k:
    name: RAG-treffers per vraag
network:
  8765/tcp: Web-UI, REST-API, chat (SSE) en MCP (/mcp)
