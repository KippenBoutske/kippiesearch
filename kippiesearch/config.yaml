name: KippieSearch
version: "0.2.0"
slug: kippiesearch
description: Lokale privacy-first semantic search, RAG-chat en MCP-server voor NAS en it's learning
url: https://github.com/KippenBoutske/kippiesearch
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
stage: experimental
homeassistant: "2024.1.0"
ingress: true
ingress_port: 8765
ingress_stream: true
panel_icon: mdi:chat-question
panel_title: KippieSearch
panel_admin: false
webui: "http://[HOST]:[PORT:8765]/"
watchdog: "http://[HOST]:[PORT:8765]/health"
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: Web UI, REST API en MCP (Streamable HTTP op /mcp)
map:
  - type: share
    read_only: true
  - type: media
    read_only: true
  - type: ssl
    read_only: true
timeout: 60
backup_exclude:
  - models/*
  - nas-cache/*
  - "*.lancedb/_indices/**"
options:
  log_level: info
  api_token: ""
  nas_roots: []
  nas_smb_enabled: false
  nas_smb_host: ""
  nas_smb_port: 445
  nas_smb_shares: []
  nas_smb_username: ""
  nas_smb_password: ""
  itslearning_enabled: false
  itslearning_url: ""
  itslearning_organisation: ""
  itslearning_username: ""
  itslearning_password: ""
  itslearning_rate_limit_s: 0.75
  itslearning_cron: "0 3 * * *"
  nas_cron: "0 */6 * * *"
  embedder: onnx
  embedding_dim: 256
  max_seq_length: 512
  onnx_threads: 2
  chunk_chars: 1800
  chunk_overlap: 220
  batch_size: 4
  max_file_mb: 32
  throttle_s: 0.05
  exclude_globs: "**/.git/**,**/node_modules/**,**/cache/**,**/caches/**,**/plugins/**,**/@eaDir/**,**/#recycle/**,**/*.min.js,**/*.map,**/*.bundle.js,**/*.umd.js,**/*.dart.js,**/*.mkv,**/*.mp4,**/*.iso"
  ocr_enabled: false
  chat_enabled: true
  chat_model: gemma3-1b
  chat_n_ctx: 2048
  chat_n_threads: 2
  chat_max_tokens: 512
  chat_temperature: 0.3
  chat_idle_unload_minutes: 15
  chat_top_k: 6
schema:
  log_level: list(debug|info|warning|error)
  api_token: password
  nas_roots:
    - str
  nas_smb_enabled: bool
  nas_smb_host: str
  nas_smb_port: port
  nas_smb_shares:
    - str
  nas_smb_username: str
  nas_smb_password: password
  itslearning_enabled: bool
  itslearning_url: str
  itslearning_organisation: str
  itslearning_username: str
  itslearning_password: password
  itslearning_rate_limit_s: float
  itslearning_cron: str
  nas_cron: str
  embedder: list(onnx|hash)
  embedding_dim: list(128|256|512|768)
  max_seq_length: int(64,2048)
  onnx_threads: int(1,8)
  chunk_chars: int(200,8000)
  chunk_overlap: int(0,2000)
  batch_size: int(1,32)
  max_file_mb: float
  throttle_s: float
  exclude_globs: str
  ocr_enabled: bool
  chat_enabled: bool
  chat_model: str
  chat_n_ctx: int(512,8192)
  chat_n_threads: int(1,8)
  chat_max_tokens: int(32,2048)
  chat_temperature: float
  chat_idle_unload_minutes: float
  chat_top_k: int(1,20)
