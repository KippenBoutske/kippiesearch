[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kippiesearch"
version = "0.1.0"
description = "Lokale privacy-first semantic search + MCP-server (Home Assistant add-on)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jens" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "lancedb>=0.21.0",
  "pyarrow>=17.0.0",
  "numpy>=2.0.0",
  "onnxruntime>=1.20.0",
  "huggingface-hub>=0.26.0",
  "tokenizers>=0.20.0",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "python-pptx>=1.0.2",
  "apscheduler>=3.10.4",
  "smbprotocol>=1.14.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "mcp>=2.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "psutil>=6.1.0",
  "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]
ocr = [
  "pymupdf>=1.24.0",
]
fallback = [
  "sentence-transformers>=3.3.0",
]

[project.scripts]
kippiesearch = "kippiesearch.main:run"

[tool.setuptools.packages.find]
where = ["kippiesearch/src"]

[tool.setuptools.package-data]
kippiesearch = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["kippiesearch/src"]
addopts = "-q --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
