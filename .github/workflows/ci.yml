name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        env:
          KIPPIESEARCH_EMBEDDER: hash
        run: pytest -q

  docker-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f kippiesearch/Dockerfile \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION=0.1.0 \
            kippiesearch \
            --load \
            -t kippiesearch:ci-amd64
      - name: Smoke /health
        run: |
          docker run -d --name kippiesearch-ci -p 8765:8765 \
            -e KIPPIESEARCH_EMBEDDER=hash \
            -e KIPPIESEARCH_AUTH_DISABLED=true \
            kippiesearch:ci-amd64
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs kippiesearch-ci
          exit 1

  docker-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64 (aarch64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f kippiesearch/Dockerfile \
            --build-arg BUILD_ARCH=aarch64 \
            --build-arg BUILD_VERSION=0.1.0 \
            kippiesearch \
            -t kippiesearch:ci-arm64
